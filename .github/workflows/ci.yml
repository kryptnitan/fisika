name: ci

on:
  push:
    branches-ignore: [verification, forge-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  verify-onchain:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Verify addresses, decimals, pools, Mento routes, Textile ladder
        env:
          # Add a CELO_RPC_URLS repo secret (comma-separated) once you have a paid RPC; public endpoint otherwise.
          CELO_RPC_URLS: ${{ secrets.CELO_RPC_URLS || 'https://forno.celo.org' }}
        run: node scripts/verify-onchain.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onchain-verification
          path: verification/
      - name: Publish summary
        if: always()
        run: test -f verification/onchain.md && cat verification/onchain.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish results to the verification branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -d verification || exit 0
          cp -r verification /tmp/verification
          git config user.name "fisika-ci"
          git config user.email "fisika-ci@users.noreply.github.com"
          git checkout --orphan publish
          git rm -rfq .
          cp /tmp/verification/* .
          git add onchain.json onchain.md
          git commit -qm "on-chain verification for ${GITHUB_SHA}"
          git push -fq origin HEAD:verification

  paper-run:
    runs-on: ubuntu-latest
    needs: verify-onchain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Live PAPER run (graph, FX board, arb scan; nothing signed)
        env:
          CELO_RPC_URLS: ${{ secrets.CELO_RPC_URLS || 'https://forno.celo.org' }}
        run: node scripts/paper-run.ts
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f verification/paper-run.md || exit 0
          cp verification/paper-run.md /tmp/paper-run.md
          cat /tmp/paper-run.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "fisika-ci"
          git config user.email "fisika-ci@users.noreply.github.com"
          git fetch -q origin verification
          git checkout -q -B pub origin/verification
          cp /tmp/paper-run.md paper-run.md
          git add paper-run.md
          git commit -qm "paper run for ${GITHUB_SHA}"
          git push -q origin HEAD:verification

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge build --sizes
      - name: Unit + fork tests
        env:
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL || 'https://forno.celo.org' }}
        run: forge test -vv --gas-report | tee forge-test.txt
      - name: Publish forge results to the forge-results branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f forge-test.txt || exit 0
          cp forge-test.txt /tmp/forge-test.txt
          cd ..
          git config user.name "fisika-ci"
          git config user.email "fisika-ci@users.noreply.github.com"
          git checkout --orphan publish
          git rm -rfq .
          cp /tmp/forge-test.txt .
          git add forge-test.txt
          git commit -qm "forge results for ${GITHUB_SHA}"
          git push -fq origin HEAD:forge-results
