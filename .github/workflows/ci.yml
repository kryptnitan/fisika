name: ci

on:
  push:
    branches-ignore: [verification, forge-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: pnpm install --no-frozen-lockfile 2>&1 | tail -40 | tee install.txt
      - name: Typecheck
        shell: bash
        run: pnpm typecheck 2>&1 | tee typecheck.txt
      - name: Unit tests
        shell: bash
        run: pnpm test 2>&1 | tee test.txt
      - name: Publish logs to the verification branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cat install.txt typecheck.txt test.txt > /tmp/core-ci.txt 2>/dev/null || true
          bash .github/publish.sh verification "core ci log for ${GITHUB_SHA}" /tmp/core-ci.txt

  verify-onchain:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Verify addresses, decimals, pools, Mento routes, Textile ladder
        env:
          # Add a CELO_RPC_URLS repo secret (comma-separated) once you have a paid RPC; public endpoint otherwise.
          CELO_RPC_URLS: ${{ secrets.CELO_RPC_URLS || 'https://forno.celo.org,https://celo-rpc.publicnode.com' }}
        run: node scripts/verify-onchain.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onchain-verification
          path: verification/
      - name: Publish summary
        if: always()
        run: test -f verification/onchain.md && cat verification/onchain.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish results to the verification branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -d verification || exit 0
          cp verification/onchain.json verification/onchain.md /tmp/
          bash .github/publish.sh verification "on-chain verification for ${GITHUB_SHA}" /tmp/onchain.json /tmp/onchain.md

  paper-run:
    runs-on: ubuntu-latest
    needs: verify-onchain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Live PAPER run (graph, FX board, arb scan; nothing signed)
        env:
          CELO_RPC_URLS: ${{ secrets.CELO_RPC_URLS || 'https://forno.celo.org,https://celo-rpc.publicnode.com' }}
        run: node scripts/paper-run.ts
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f verification/paper-run.md || exit 0
          cp verification/paper-run.md verification/graph-snapshot.json /tmp/
          cat /tmp/paper-run.md >> "$GITHUB_STEP_SUMMARY"
          bash .github/publish.sh verification "paper run for ${GITHUB_SHA}" /tmp/paper-run.md /tmp/graph-snapshot.json

  verify-onchain-bsc:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Verify BNB Chain addresses, decimals, pools, Textile ladder
        env:
          CHAIN: bsc
          RPC_URLS: ${{ secrets.BSC_RPC_URLS }}
        run: node scripts/verify-onchain.ts
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f verification/onchain-bsc.md || exit 0
          cat verification/onchain-bsc.md >> "$GITHUB_STEP_SUMMARY"
          cp verification/onchain-bsc.json verification/onchain-bsc.md /tmp/
          bash .github/publish.sh verification "bsc on-chain verification for ${GITHUB_SHA}" /tmp/onchain-bsc.json /tmp/onchain-bsc.md

  paper-run-bsc:
    runs-on: ubuntu-latest
    needs: verify-onchain-bsc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Live PAPER run on BNB Chain (nothing signed)
        env:
          CHAIN: bsc
          RPC_URLS: ${{ secrets.BSC_RPC_URLS }}
        run: node scripts/paper-run.ts
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f verification/paper-run-bsc.md || exit 0
          cp verification/paper-run-bsc.md verification/graph-snapshot-bsc.json /tmp/
          cat /tmp/paper-run-bsc.md >> "$GITHUB_STEP_SUMMARY"
          bash .github/publish.sh verification "bsc paper run for ${GITHUB_SHA}" /tmp/paper-run-bsc.md /tmp/graph-snapshot-bsc.json

  web:
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Build web
        shell: bash
        run: pnpm --filter @fisika/web build 2>&1 | tee web-build.txt
      - name: Run API + web against Celo and screenshot every page
        shell: bash
        env:
          CELO_RPC_URLS: ${{ secrets.CELO_RPC_URLS || 'https://forno.celo.org,https://celo-rpc.publicnode.com' }}
          INTERNAL_API_KEYS: ci-internal-key-0123456789abcdef
          INTERNAL_API_KEY: ci-internal-key-0123456789abcdef
          API_URL: http://localhost:8787
          CHAINS: celo,bsc
          EXECUTION_ENABLED: 'true'
        run: |
          (cd apps/api && node src/server.ts > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8787/health >/dev/null && curl -sf localhost:3000 >/dev/null && break; sleep 3; done
          sleep 20
          timeout 300 npx -y playwright@1.49.0 install --with-deps chromium > /dev/null
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 6000 --viewport-size 1360,900 http://localhost:3000/ shot-rates.png
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 4000 --viewport-size 390,844 http://localhost:3000/ shot-rates-mobile.png
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 4000 --viewport-size 1360,900 http://localhost:3000/arb shot-arb.png
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 4000 --viewport-size 1360,900 http://localhost:3000/agents shot-agents.png
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 8000 --viewport-size 1360,900 'http://localhost:3000/?chain=bsc' shot-rates-bsc.png
          timeout 90 npx -y playwright@1.49.0 screenshot --full-page --wait-for-timeout 6000 --viewport-size 390,844 'http://localhost:3000/?chain=bsc' shot-rates-bsc-mobile.png
          curl -s localhost:8787/v1/chains > chains.json || true
          curl -s -X POST localhost:8787/bsc/v1/quote -H 'content-type: application/json' -H 'x-api-key: ci-internal-key-0123456789abcdef' -d '{"tokenIn":"USDT","tokenOut":"cNGN","amount":"100"}' > quote-sample-bsc.json || true
          # A taker with no funds: the build must fail cleanly (Textile wants proof of funds / key), never 500.
          QID=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('quote-sample-bsc.json','utf8')).quoteId||'')}catch{}")
          curl -s -w '\nHTTP %{http_code}\n' -X POST localhost:8787/bsc/v1/build -H 'content-type: application/json' -H 'x-api-key: ci-internal-key-0123456789abcdef' -d "{\"quoteId\":\"$QID\",\"taker\":\"0x000000000000000000000000000000000000dEaD\"}" > build-sample-bsc.txt || true
          curl -s -X POST localhost:8787/v1/quote -H 'content-type: application/json' -H 'x-api-key: ci-internal-key-0123456789abcdef' -d '{"tokenIn":"cNGN","tokenOut":"USDT","amount":"50000"}' > quote-sample.json || true
          curl -s -o /dev/null -w '%{http_code}\n' -X POST localhost:8787/v1/quote -H 'content-type: application/json' -d '{"tokenIn":"cNGN","tokenOut":"USDT","amount":"50000"}' > x402-unpaid-status.txt || true
          tail -50 /tmp/api.log > api.log; tail -50 /tmp/web.log > web.log
      - name: Publish build log and screenshots
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          files=""
          for f in web-build.txt shot-rates.png shot-rates-mobile.png shot-arb.png shot-agents.png shot-rates-bsc.png shot-rates-bsc-mobile.png chains.json quote-sample-bsc.json build-sample-bsc.txt quote-sample.json x402-unpaid-status.txt api.log web.log; do test -f "$f" && cp "$f" /tmp/ && files="$files /tmp/$f"; done
          test -n "$files" && bash .github/publish.sh verification "web build + screenshots for ${GITHUB_SHA}" $files || true

  live-fork:
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --no-frozen-lockfile
      - name: Live trader end-to-end on an anvil fork of Celo
        shell: bash
        env:
          FORK_UPSTREAM: ${{ secrets.CELO_RPC_URL || 'https://forno.celo.org' }}
        run: |
          anvil --fork-url "$FORK_UPSTREAM" --port 8545 --silent &
          for i in $(seq 1 30); do curl -sf -X POST localhost:8545 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null && break; sleep 1; done
          cd apps/api && node test-fork/live-fork.ts 2>&1 | tee ../../live-fork.txt; exit ${PIPESTATUS[0]}
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: test -f live-fork.txt && cp live-fork.txt /tmp/ && bash .github/publish.sh verification "live fork test for ${GITHUB_SHA}" /tmp/live-fork.txt || true

  live-fork-bsc:
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --no-frozen-lockfile
      - name: Live trader + dashboard swap end-to-end on an anvil fork of BNB Chain
        shell: bash
        env:
          FORK_UPSTREAM: ${{ secrets.BSC_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
        run: |
          anvil --fork-url "$FORK_UPSTREAM" --chain-id 56 --port 8545 --silent &
          for i in $(seq 1 30); do curl -sf -X POST localhost:8545 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null && break; sleep 1; done
          cd apps/api && node test-fork/live-fork-bsc.ts 2>&1 | tee ../../live-fork-bsc.txt; exit ${PIPESTATUS[0]}
      - name: Publish
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: test -f live-fork-bsc.txt && cp live-fork-bsc.txt /tmp/ && bash .github/publish.sh verification "bsc live fork test for ${GITHUB_SHA}" /tmp/live-fork-bsc.txt || true

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge build --sizes
      - name: Unit + fork tests
        env:
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL || 'https://forno.celo.org' }}
        run: forge test -vv --gas-report | tee forge-test.txt
      - name: Publish forge results to the verification branch
        if: always() && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          test -f contracts/forge-test.txt || exit 0
          cp contracts/forge-test.txt /tmp/forge-test.txt
          bash .github/publish.sh verification "forge results for ${GITHUB_SHA}" /tmp/forge-test.txt
